<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OAuth Example 3</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: #111827;
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
    }

    .host-demo {
      width: min(920px, calc(100% - 32px));
      margin: 32px auto;
      padding: 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.1);
    }

    .host-demo h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    .host-demo p {
      max-width: 58ch;
      line-height: 1.6;
    }

    pre {
      margin: 16px 0 0;
      padding: 14px;
      border-radius: 16px;
      background: #0f172a;
      color: #e2e8f0;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <main class="host-demo">
    <h1>Host page di esempio</h1>
    <p>Il widget React viene montato come overlay fisso sopra la pagina, con stile autosufficiente e senza dipendere dal CSS host.</p>
    <pre id="hostProfileOutput">null</pre>
  </main>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    const hostProfileOutput = document.getElementById('hostProfileOutput');

    function renderHostProfile(profile) {
      hostProfileOutput.textContent = JSON.stringify(profile || null, null, 2);
    }

    window.addEventListener('oauth-widget:profile', (event) => {
      renderHostProfile(event.detail?.profile || null);
    });
  </script>
  <script type="text/babel" data-presets="react" src="app/assets/example3-app.jsx"></script>
</body>
</html>
