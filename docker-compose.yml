services:
  oauth-server:
    container_name: ${OAUTH_SERVER_CONTAINER_NAME:-oauth-server}
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OAUTH_SERVER_IMAGE:-docker.io/andpra70/oauth-server:latest}
    restart: ${OAUTH_SERVER_RESTART:-unless-stopped}
    ports:
      - "${OAUTH_SERVER_PORT:-9000}:${PORT:-9000}"
    command: ["npm", "start"]
    environment:
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      PASSWORD_RESET_PUBLIC_URL: ${PASSWORD_RESET_PUBLIC_URL:-http://localhost:9000/reset-password}
      PASSWORD_RESET_TOKEN_TTL_SECONDS: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:-900}
    depends_on:
      - mailpit
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 9000) + (process.env.BASE_PATH || '') + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ${OAUTH_SERVER_DATA_VOLUME:-oauth-server-data}:/app/data/oauth

  mailpit:
    image: axllent/mailpit:v1.27
    restart: ${OAUTH_SERVER_RESTART:-unless-stopped}
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  oauth-server-data:
