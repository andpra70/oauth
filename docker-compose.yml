services:
  oauth-server:
    container_name: ${OAUTH_SERVER_CONTAINER_NAME:-oauth-server}
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OAUTH_SERVER_IMAGE:-docker.io/andpra70/oauth-server:latest}
    restart: ${OAUTH_SERVER_RESTART:-unless-stopped}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${OAUTH_SERVER_PORT:-9000}:${PORT:-9000}"
    command: ["npm", "start"]
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://root:rootpass@mongo:27017/oauth2?authSource=admin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VFS_GOOGLE_CLIENT_ID: ${VFS_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
      VFS_GOOGLE_CLIENT_SECRET: ${VFS_GOOGLE_CLIENT_SECRET:-${GOOGLE_CLIENT_SECRET}}
      VFS_GOOGLE_CALLBACK_URL: ${VFS_GOOGLE_CALLBACK_URL:-http://localhost:9000/auth/api/callback}
      VFS_GOOGLE_CALLBACK_URLS: ${VFS_GOOGLE_CALLBACK_URLS:-http://localhost:9000/auth/api/callback}
      VFS_JWT_ISSUER: ${VFS_JWT_ISSUER:-vfs-auth}
      VFS_JWT_AUDIENCE: ${VFS_JWT_AUDIENCE:-vfs-clients}
      VFS_PRIVATE_KEY_PATH: /run/secrets/private.pem
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([fetch('http://127.0.0.1:' + (process.env.PORT || 9000) + (process.env.BASE_PATH || '') + '/health'),fetch('http://127.0.0.1:' + (process.env.PORT || 9000) + '/healthz')]).then(r=>process.exit(r.every(x=>x.ok)?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ${OAUTH_SERVER_DATA_VOLUME:-oauth-server-data}:/app/data/oauth
      - ./keys/private.pem:/run/secrets/private.pem:ro

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpass}
    volumes:
      - oauth-server-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - oauth-server-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  oauth-server-data:
  oauth-server-mongo:
  oauth-server-redis:
